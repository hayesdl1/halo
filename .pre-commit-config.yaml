# Install once with: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: block-data-files
        name: block data files (.parquet, files over 5 MB, credentials)
        entry: python tools/check_staged_files.py
        language: system
        pass_filenames: true
        stages: [pre-commit]
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
