name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Block data files in the tree
        run: git ls-files | python tools/check_staged_files.py --stdin
      - name: Ruff
        run: ruff check .
      - name: Pytest (synthetic fixtures only, no WRDS)
        run: pytest -q
