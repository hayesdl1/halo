[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halo"
version = "0.1.0"
description = "US-equity replication and honest assessment of the HALO capital intensity score"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
# wrds is only needed on the user's machine for the pull scripts. CI never installs it.
wrds = ["wrds>=3.2"]
dev = ["pytest>=7.4", "ruff>=0.4", "pre-commit>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
